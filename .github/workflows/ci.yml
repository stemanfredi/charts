# Test on every push and pull request; publish to GitHub Pages from main when tests pass.
# Weekly: the same tests against the live tile providers (the page depends on them) plus a
# report of newer CDN library versions. Repo setting needed once: Pages → Source: GitHub Actions.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test                 # unit tests, offline
      - run: npm run check            # index.html CDN block matches pins, hashes and CSP
      - run: npm run smoke            # headless Chrome against the live providers
        env:
          CHROME: /usr/bin/google-chrome
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run deps             # newer library versions show as notices

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Site files only (no tools, tests or dev dependencies)
        run: mkdir _site && cp index.html *.js *.css _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
