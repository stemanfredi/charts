# Test on pushes to main and on pull requests; publish main to GitHub Pages when tests pass.
# Weekly: the same tests against the live tile providers (the page depends on them) plus a
# report of newer library versions and data. Repo setting needed once: Pages → Source: GitHub Actions.
# Actions are pinned to commits (tag in the comment); bump them deliberately.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:                              # offline: fast and deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test                # unit tests, offline (site/vendor/ and the policy up to date too)
      - run: npm run lint            # ESLint's recommended rules
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm outdated || true    # newer library versions, in the log
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run data-check      # newer density data shows as a notice

  browser:                           # headless Chrome against the live tile providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # one retry each: a provider hiccup should not block a deploy, a real failure still does. On a push,
      # what a provider served (tiles, legends, places found) is checked but not held against the page:
      # said as warnings; the weekly run is strict, so a provider down for a week is a failed run (mailed)
      # a pass only on the retry is a warning on the run, so a check that fails now and then is seen
      - run: npm run smoke || (echo "::warning title=Retry::smoke passed only on its retry"; sleep 60; npm run smoke)
        env:
          STRICT: ${{ github.event_name == 'schedule' && '1' || '' }} # a run by hand is a redeploy: a provider's outage must not block it
      - run: npm run ui || (echo "::warning title=Retry::ui passed only on its retry"; sleep 60; npm run ui) # no overlaps, 44 px targets, 390/820/1280 px
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run tiles-check     # known trouble spots: seams, zooms, lakes (live data, weekly)

  deploy:
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # the version shown in About: the commit published, and its date
      - run: printf '{"commit":"%s","date":"%s"}\n' "$GITHUB_SHA" "$(git log -1 --format=%cI)" > site/version.json
      # the service worker's version: the commit, so each deploy is a new worker that fetches its files
      # (a development copy keeps 'dev': the network first)
      - run: sed -i "s/^const VERSION = 'dev';/const VERSION = '$GITHUB_SHA';/" site/sw.js && grep -q "^const VERSION = '$GITHUB_SHA';" site/sw.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site                 # the site files only: no tools, tests or dev dependencies
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346    # v5.0.1
